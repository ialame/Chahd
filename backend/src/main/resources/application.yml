spring:
  application:
    name: chahd-backend
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chahd}
    username: ${DB_USER:chahd}
    password: ${DB_PASSWORD:chahd}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  admin:
    # Clé d'accès au suivi (/api/admin/suivi et page /suivi). À surcharger en prod via ADMIN_KEY.
    key: ${ADMIN_KEY:chahd-suivi-dev}

logging:
  level:
    ma.chahd: INFO
