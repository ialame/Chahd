spring:
  application:
    name: chahd-backend
  datasource:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:chahd}
    username: ${DB_USER:chahd}
    password: ${DB_PASSWORD:chahd}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    # Secret de signature des jetons (≥ 32 caractères). À surcharger en prod via JWT_SECRET.
    secret: ${JWT_SECRET:chahd-dev-secret-change-me-please-0123456789abcdef}
    expiration-seconds: ${JWT_EXPIRATION:604800}
  admin:
    # Clé d'accès au suivi (/api/admin/suivi et page /suivi). À surcharger en prod via ADMIN_KEY.
    key: ${ADMIN_KEY:chahd-suivi-dev}
    # Compte admin créé/promu au démarrage (laisser vide pour ne rien créer).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    nom: ${ADMIN_NOM:Admin}

# Tuteur IA AXIOM (proxy vers l'API Anthropic). La clé reste côté serveur uniquement.
# Sans ANTHROPIC_API_KEY, /api/axiom/chat renvoie 503 (le reste de l'app fonctionne).
anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-6}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:1000}

logging:
  level:
    ma.chahd: INFO
