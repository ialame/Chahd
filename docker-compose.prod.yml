# Déploiement Chahd (bacpp.net) — MariaDB + API Spring Boot + Nuxt SSR + Caddy (HTTPS auto).
# Lancer sur le VPS :  docker compose -f docker-compose.prod.yml up -d --build
# Voir DEPLOY.md pour la procédure complète.
services:
  db:
    image: mariadb:11.7
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-chahd}
      MARIADB_USER: ${DB_USER:-chahd}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD requis (voir .env)}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD requis (voir .env)}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-chahd}
      DB_USER: ${DB_USER:-chahd}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGINS: https://bacpp.net,https://www.bacpp.net
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
      ADMIN_KEY: ${ADMIN_KEY:?ADMIN_KEY requis (clé du suivi /suivi)}
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      # Navigateur -> domaine public ; SSR -> API interne (réseau Docker).
      NUXT_PUBLIC_API_BASE: https://bacpp.net/api
      NUXT_API_BASE_SSR: http://api:8081/api
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

volumes:
  db_data:
  caddy_data:
  caddy_config:
